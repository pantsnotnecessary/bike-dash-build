# bike-dash on Waveshare ESP32-P4-NANO + Riverdi RVT70HSMNWC00-B (7" 1024x600, 850 nit)
# Stage 0/1 bring-up config. Validate with `esphome config` first.
# Pins follow docs/wiring.md: panel RESET on GPIO27, PT4115 DIM on GPIO26 (P4-NANO BSP defaults).

substitutions:
  name: bike-dash
  lcd_reset_pin: GPIO27
  backlight_pwm_pin: GPIO26

esphome:
  name: ${name}

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    # sdkconfig_options:
    #   CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"

psram:
  mode: hex
  speed: 200MHz

logger:
  hardware_uart: UART0
  level: DEBUG

# Onboard ESP32-C6 (Wi-Fi 6 / BLE) over SDIO. Values from the ESPHome device page for the P4-NANO.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz

# Backlight: LEDC PWM into the PT4115 DIM pin. About 5 kHz so it is not visible.
output:
  - platform: ledc
    id: backlight_pwm
    pin: ${backlight_pwm_pin}
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    dimensions:
      width: 1024
      height: 600
    lanes: 2
    lane_bit_rate: 900Mbps        # try 800-1000 if scrambled
    pclk_frequency: 51.2MHz       # datasheet typ; 44.9-63 MHz allowed
    hsync_pulse_width: 70
    hsync_back_porch: 160
    hsync_front_porch: 160
    vsync_pulse_width: 10
    vsync_back_porch: 23
    vsync_front_porch: 12
    reset_pin: ${lcd_reset_pin}
    # Riverdi datasheet p.16, verbatim. 0xB2 0x50 = 2-lane.
    init_sequence:
      - [0x01]
      - delay 120ms
      - [0xB2, 0x50]
      - [0x80, 0x4B]
      - [0x81, 0xFF]
      - [0x82, 0x1A]
      - [0x83, 0x88]
      - [0x84, 0x8F]
      - [0x85, 0x35]
      - [0x86, 0xB0]
      - [0x11]
      - delay 120ms
      - [0x29]
      - delay 20ms
    auto_clear_enabled: false
    update_interval: never
    # Stage 1 test: fill the screen. Replace with the LVGL block from bike-dash at Stage 3.
    lambda: |-
      it.fill(Color(0, 80, 0));
      it.filled_rectangle(100, 100, 824, 400, Color(200, 200, 200));
